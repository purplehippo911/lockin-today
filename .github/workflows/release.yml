on:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: 1.46  # or latest stable
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install Linux deps
      if: matrix.platform == 'ubuntu-22.04'
      run: |
        sudo apt update
        sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libclang-dev pkg-config
    - name: Install deps & build frontend
      run: deno task install  # or deno install && deno task build (if separate)
    - uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: app-v__VERSION__
        releaseName: 'lockin-today v__VERSION__'
        releaseBody: 'See CHANGELOG.md'
        releaseDraft: false
        prerelease: false
