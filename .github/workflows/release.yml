name: Publish Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write  # Move to workflow level

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # For git tags

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'  # LTS
        cache: 'npm'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-gnu  # Optional: add for cross-compilation

    - name: Rust cache
      uses: swatinem/rust-cache@v2

    - name: Install Linux deps
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt update
        sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libgirepository1.0-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libclang-dev pkg-config patchelf libdbus-1-dev libadwaita-1-dev libasound2-dev

    - name: Install npm dependencies
      run: npm ci  # Faster, cleaner than npm install

    - uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: ${{ github.ref_name }}
        releaseName: 'lockin-today ${{ github.ref_name }}'
        releaseBody: 'See CHANGELOG.md for details.'
        releaseDraft: false
        prerelease: false
