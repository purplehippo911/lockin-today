name: Publish Release
on:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: 2.7  # Always latest stable (2.7.x now)
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install Linux deps
      if: matrix.platform == 'ubuntu-22.04'
      run: |
        sudo apt update
        sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgdk3-dev libglib2.0-dev libgirepository1.0-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libclang-dev pkg-config patchelf libdbus-1-dev libgtk-3-dev libadwaita-1-dev
    - name: Cache Deno
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/deno
          deno.lock
        key: deno-${{ runner.os }}-${{ hashFiles('**/deno.json', 'deno.lock') }}
    - name: Install deps & build frontend
      run: deno install
    - uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: app-v__VERSION__
        releaseName: 'lockin-today v__VERSION__'
        releaseBody: 'See CHANGELOG.md for details.'
        releaseDraft: false
        prerelease: false
